# fly.toml app configuration file generated for portfolio-me-rust on 2025-07-14T10:16:43-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jonkarrer'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Stage 1: one machine, scales to zero (portfolio site; auto_start wakes it).
  min_machines_running = 0
  processes = ['app']

[[vm]]
  # Standard starting size — usingai runs the identical stack at 256mb.
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
